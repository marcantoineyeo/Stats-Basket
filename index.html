        <div class="dgctl"><button data-t="dgStep" data-k="-1">⏮</button><button id="diagPlay" data-t="dgPlay">▶</button><button data-t="dgStep" data-k="1">⏭</button></div>
        <p id="diagCap" class="small" style="text-align:center;margin:4px 0 0"></p>
        <p class="legend small muted"><span class="lg o">●</span> attaquant <span class="lg x">✕</span> défenseur <span class="lg c">■</span> coach <span class="lg k">▲</span> plot · — course · 〰 dribble · - - passe · <span style="color:#ea580c">→</span> tir</p></div>`:""}
      ${yt?`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${yt}" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:""}
      ${d.summary?`<p style="margin:10px 0 0">${esc(d.summary)}</p>`:""}
    </div>
    ${d.steps&&d.steps.length?`<div class="card"><h2>Déroulement</h2><ol class="dl">${list(d.steps)}</ol></div>`:""}
    ${d.rot?`<div class="card"><h2>🔄 Rotations</h2><p style="margin:0">${esc(d.rot)}</p></div>`:""}
    ${d.keys&&d.keys.length?`<div class="card"><h2>🎯 Points clés</h2><ul class="dl">${list(d.keys)}</ul></div>`:""}
    ${d.vars&&d.vars.length?`<div class="card"><h2>➕ Variantes</h2><ul class="dl">${list(d.vars)}</ul></div>`:""}
    ${!yt?`<a class="btn ghost block" style="text-align:center;text-decoration:none;margin-bottom:10px" href="https://www.youtube.com/results?search_query=${encodeURIComponent("exercice basket "+d.name)}" target="_blank" rel="noopener">▶ Voir des vidéos de cet exercice (YouTube)</a>`:""}
    ${se?`<button class="btn acc block" style="margin-bottom:10px" data-t="addBlock" data-v="${esc(d.id)}">＋ Ajouter à « ${esc(se.title)} »</button>`:""}
    ${custom?`<div class="endbar"><button class="btn ghost" data-t="editDrill" data-v="${esc(d.id)}">✏️ Modifier</button><button class="btn ghost" style="color:var(--ko)" data-t="delDrill" data-v="${esc(d.id)}">Supprimer</button></div>`:""}`;
}
function vDrillEdit(){
  const d=S.dEdit||{};const L=a=>esc((a||[]).join("\n"));
  return `<button class="back" data-t="lib">← Exercices</button>
    <div class="card"><h2>${d.id?"Modifier l'exercice":"Nouvel exercice"}</h2>
      <div class="field"><span>Nom</span><input id="de_name" value="${esc(d.name||"")}"></div>
      <div class="grid2"><div class="field"><span>Thème</span><select id="de_theme">${THORDER.map(k=>`<option value="${k}" ${d.theme===k?"selected":""}>${thN(k)}</option>`).join("")}</select></div>
        <div class="field"><span>Durée (min)</span><input id="de_min" type="number" inputmode="numeric" value="${d.min||10}"></div></div>
      <div class="grid2"><div class="field"><span>Joueurs</span><input id="de_players" value="${esc(d.players||"")}" placeholder="ex. 6+"></div>
        <div class="field"><span>Intensité</span><select id="de_int">${[1,2,3].map(v=>`<option value="${v}" ${(d.int||2)===v?"selected":""}>${dots(v)}</option>`).join("")}</select></div></div>
      <div class="field"><span>Matériel</span><input id="de_equip" value="${esc(d.equip||"")}"></div>
      <div class="field"><span>Résumé</span><input id="de_summary" value="${esc(d.summary||"")}"></div>
      <div class="field"><span>Déroulement (une étape par ligne)</span><textarea id="de_steps" rows="4">${L(d.steps)}</textarea></div>
      <div class="field"><span>Rotations</span><textarea id="de_rot" rows="2">${esc(d.rot||"")}</textarea></div>
      <div class="field"><span>Points clés (un par ligne)</span><textarea id="de_keys" rows="3">${L(d.keys)}</textarea></div>
      <div class="field"><span>Variantes (une par ligne)</span><textarea id="de_vars" rows="2">${L(d.vars)}</textarea></div>
      <div class="field"><span>Vidéo (lien YouTube, s'affiche dans la fiche)</span><input id="de_video" value="${esc(d.video||"")}" placeholder="https://youtu.be/…" inputmode="url"></div>
      <div class="field"><span>Schéma animé</span><select id="de_base"><option value="">Aucun</option>${DRILLS.filter(x=>x.frames).map(x=>`<option value="${x.id}" ${d.base===x.id?"selected":""}>Reprendre : ${esc(x.name)}</option>`).join("")}</select></div>
      <button class="btn acc block" data-t="saveDrill">Enregistrer</button>
    </div>`;
}
function vRun(){
  const se=S.sessions[R.sid],b=se.blocks[R.i],d=getDrill(b.d)||{name:"?",theme:"calme"},nx=se.blocks[R.i+1],nd=nx&&getDrill(nx.d);
  return `<div class="run">
    <div class="run-top"><button class="menu" data-t="runQuit">✕</button><div class="run-ti"><b>${esc(se.title)}</b><span class="small muted">Exercice ${R.i+1}/${se.blocks.length}</span></div><button class="menu" data-t="teams">👥</button></div>
    <div class="run-name" style="border-color:${thC(d.theme)}"><span class="badge" style="background:${thC(d.theme)}">${thN(d.theme)}</span> ${esc(d.name)}</div>
    <div class="run-timer"><span id="runT">${mmss(R.left,true)}</span><div class="run-prog"><i id="runP" style="width:${100-R.left/((b.min||1)*60000)*100}%;background:${thC(d.theme)}"></i></div></div>
    ${drillFrames(d)?`<div class="run-dg"><div id="diag"></div><p id="diagCap" class="small" style="text-align:center;margin:2px 0 0"></p></div>`:`<div class="run-txt">${esc(d.summary||"")}</div>`}
    ${d.keys&&d.keys.length?`<ul class="run-keys">${d.keys.slice(0,3).map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`:""}
    <div class="run-ctl"><button data-t="runGo" data-k="-1" ${R.i?"":"disabled"}>⏮</button><button class="big ${R.run?"on":""}" data-t="runPlay">${R.run?"❚❚":"▶"}</button><button data-t="runGo" data-k="1" ${nx?"":"disabled"}>⏭</button></div>
    <div class="run-next small muted">${nx?`Ensuite : <b>${esc(nd?nd.name:"?")}</b> · ${nx.min} min`:"Dernier exercice"}${b.note?` · Note : ${esc(b.note)}`:""}</div>
  </div>`;
}
function trainAfter(){
  document.body.classList.toggle("runmode",S.view==="train"&&S.tv==="run");
  if(S.view!=="train")return;
  if(S.tv==="drill"){const d=getDrill(S.dSel);if(d&&drillFrames(d))diagStart(d,true,false)}
  if(S.tv==="run"){const se=S.sessions[R.sid],d=se&&getDrill(se.blocks[R.i].d);if(d&&drillFrames(d))diagStart(d,true,true)}
  if(S.tv==="lib"&&S.libQ)libFilter(S.libQ);
}
function libFilter(q){q=(q||"").toLowerCase().trim();document.querySelectorAll("#libList .dcard").forEach(c=>{c.style.display=!q||c.dataset.name.includes(q)?"":"none"})}

/* ---------- Modales ---------- */
function teamsModal(){
  const se=S.sessions[S.tSel||R.sid];if(!se)return;
  const act=S.team.players.filter(p=>!p.off);
  if(!se.present)se.present=act.map(p=>p.id);
  const pres=se.present.filter(id=>player(id));
  modal(`<h2>👥 Présents (${pres.length})</h2>
    <div class="chk" style="margin:8px 0">${act.map(p=>`<label><input type="checkbox" data-tp="${p.id}" ${pres.includes(p.id)?"checked":""}> #${esc(p.num)} ${esc(p.name)}</label>`).join("")}</div>
    <p class="small muted" style="margin:0 0 6px">Équipes équilibrées d'après l'évaluation moyenne en match (les joueurs sans stats comptent pour 0).</p>
    <div class="endbar" style="grid-template-columns:repeat(3,1fr);margin:0 0 8px"><button class="btn ghost" data-t="mkTeams" data-k="2">2 équipes</button><button class="btn ghost" data-t="mkTeams" data-k="3">3 groupes</button><button class="btn ghost" data-t="mkTeams" data-k="4">4 groupes</button></div>
    <div id="teamsOut"></div>
    <button class="btn ghost block" data-t="closeTeams">Fermer</button>`);
}
const TCOL=["#ea580c","#2563eb","#16a34a","#9333ea"],TNAME=["Orange","Bleu","Vert","Violet"];
function bilanModal(){
  const se=S.sessions[S.tSel||R.sid];if(!se)return;S.bil={r:se.rating||0};
  modal(`<h2>✅ Bilan de la séance</h2>
    <p class="small muted" style="margin:0 0 6px">Comment s'est passée la séance ?</p>
    <div class="stars">${[1,2,3,4,5].map(k=>`<button data-t="bilR" data-k="${k}" class="${k<=S.bil.r?"on":""}">★</button>`).join("")}</div>
    <div class="field"><span>Notes (ce qui a marché, à revoir…)</span><textarea id="bilN" rows="4">${esc(se.notes||"")}</textarea></div>
    <p class="small muted">${se.present?se.present.length+" présents notés":"Présents : utilise 👥 pour les noter"}</p>
    <button class="btn acc block" data-t="bilOK">Enregistrer et terminer</button>
    <button class="btn ghost block" style="margin-top:8px" data-t="closeTeams">Plus tard</button>`);
}

/* ---------- Actions (capture : prioritaire sur le gestionnaire général) ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-t]");if(!el)return;
  e.stopPropagation();
  const a=el.dataset.t,v=el.dataset.v,k=+el.dataset.k;
  const se=S.sessions[S.tSel];
  const go=(tv)=>{S.tv=tv;render();window.scrollTo(0,0)};
  switch(a){
    case"home":S.pick=false;go("home");break;
    case"newSess":{if(!canWrite)return;const n=newSession();S.tSel=n.id;S.pick=true;go("lib");toast("Séance créée : ajoute des exercices")}break;
    case"genSess":{if(!canWrite)return;const n=genFromStats();S.tSel=n.id;S.pick=false;go("edit");toast("⚡ Séance générée d'après vos stats")}break;
    case"lib":S.pick=!!(S.pick&&se);S.fromSess=false;go("lib");break;
    case"libPick":S.pick=true;go("lib");break;
    case"backSess":S.pick=false;S.fromSess=false;go("edit");break;
    case"openSess":S.tSel=v;S.pick=false;go("edit");break;
    case"openDrill":S.dSel=v;S.fromSess=S.tv==="edit";DIAG.paused=false;DIAG.keep=null;go("drill");break;
    case"libTh":S.libTh=v;render();break;
    case"addBlock":{if(!se)return;const d=getDrill(v);se.blocks.push({id:uid(),d:v,min:d.min||10});saveSess(se);toast(`＋ ${d.name} (${sTotal(se)} min)`);if(S.tv==="drill"){S.fromSess=true;go("edit")}else render()}break;
    case"bMin":{const b=se.blocks.find(x=>x.id===v);if(b){b.min=Math.max(1,(b.min||0)+k);saveSess(se);render()}}break;
    case"bMove":{const i=se.blocks.findIndex(x=>x.id===v),j=i+k;if(i>=0&&j>=0&&j<se.blocks.length){const t=se.blocks[i];se.blocks[i]=se.blocks[j];se.blocks[j]=t;saveSess(se);render()}}break;
    case"bDel":se.blocks=se.blocks.filter(x=>x.id!==v);saveSess(se);render();break;
    case"run":R.sid=se.id;runLoad(0);go("run");break;
    case"runPlay":{if(!R.run){beep(1,1,1);R.last=Date.now();R.run=true;grabWake()}else{R.run=false;releaseWake()}render()}break;
    case"runGo":runLoad(R.i+k);render();break;
    case"runQuit":R.run=false;releaseWake();S.tSel=R.sid;go("edit");break;
    case"teams":teamsModal();break;
    case"mkTeams":{const s2=S.sessions[S.tSel||R.sid];const ids=(s2.present||[]).filter(id=>player(id));if(ids.length<k){toast("Pas assez de présents");return}
      const G=makeTeams(ids,k);S.lastTeams=G;
      document.getElementById("teamsOut").innerHTML=G.map((g,gi)=>`<div class="tgrp" style="border-color:${TCOL[gi]}"><b style="color:${TCOL[gi]}">${TNAME[gi]} (${g.length})</b><span>${g.map(id=>esc(pName(id))).join(", ")}</span></div>`).join("")+`<button class="btn ghost block" style="margin:6px 0 8px" data-t="copyTeams">📋 Copier les équipes</button>`}break;
    case"copyTeams":copyText((S.lastTeams||[]).map((g,gi)=>`${TNAME[gi]} : ${g.map(pName).join(", ")}`).join("\n"),"Équipes copiées ✔");break;
    case"closeTeams":closeModal();break;
    case"shareSess":{const t=sessText(se);if(navigator.share)navigator.share({title:se.title,text:t}).catch(()=>{});else copyText(t,"Programme copié ✔")}break;
    case"bilan":bilanModal();break;
    case"bilR":S.bil.r=k;document.querySelectorAll(".stars button").forEach((b,i)=>b.classList.toggle("on",i<k));break;
    case"bilOK":{const s2=S.sessions[S.tSel||R.sid];s2.rating=S.bil.r;s2.notes=document.getElementById("bilN").value;s2.status="done";s2.doneAt=Date.now();saveSess(s2);R.run=false;releaseWake();S.tSel=s2.id;closeModal();go("edit");toast("Séance terminée ✅")}break;
    case"reopenSess":se.status="plan";saveSess(se);render();break;
    case"askDelSess":modal(`<h2>Supprimer la séance ?</h2><p class="muted">« ${esc(se.title)} » sera supprimée pour tout le monde.</p><div class="endbar" style="margin:0"><button class="btn ghost" data-t="closeTeams">Annuler</button><button class="btn danger" data-t="delSess">Supprimer</button></div>`);break;
    case"delSess":{const id=se.id;delete S.sessions[id];dirty.delete("s:"+id);tomb.add("s:"+id);saveLocal();schedule("s:"+id,0);closeModal();go("home")}break;
    case"dgPlay":diagToggle();break;
    case"dgStep":diagStep(k);break;
    case"newDrill":S.dEdit={theme:"tir",min:10,int:2};go("drillEdit");break;
    case"editDrill":S.dEdit=clone(S.drills[v]);go("drillEdit");break;
    case"saveDrill":{
      const g=id=>document.getElementById(id).value,lines=id=>g(id).split("\n").map(x=>x.trim()).filter(Boolean);
      const name=g("de_name").trim();if(!name){toast("Donne un nom à l'exercice");return}
      const id=(S.dEdit&&S.dEdit.id)||("c"+uid());
      S.drills[id]={id,custom:true,name,theme:g("de_theme"),min:+g("de_min")||10,players:g("de_players"),int:+g("de_int")||2,equip:g("de_equip"),
        summary:g("de_summary"),steps:lines("de_steps"),rot:g("de_rot"),keys:lines("de_keys"),vars:lines("de_vars"),video:g("de_video").trim(),base:g("de_base")||null,createdAt:(S.dEdit&&S.dEdit.createdAt)||Date.now(),updatedAt:0};
      touch("d:"+id);S.dSel=id;S.fromSess=false;go("drill");toast("Exercice enregistré ✔")}break;
    case"delDrill":{S.drills[v].deleted=true;touch("d:"+v);go("lib");toast("Exercice supprimé")}break;
  }
},true);
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.tl==="q"){S.libQ=t.value;libFilter(t.value)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.ts){const se=S.sessions[S.tSel];if(!se)return;se[t.dataset.ts]=t.dataset.ts==="target"?+t.value:t.value;saveSess(se);if(t.tagName==="SELECT"){t.blur();render()}}
  if(t.dataset.tp){const se=S.sessions[S.tSel||R.sid];if(!se)return;const id=t.dataset.tp;se.present=se.present||[];
    if(t.checked){if(!se.present.includes(id))se.present.push(id)}else se.present=se.present.filter(x=>x!==id);saveSess(se);
    const h=document.querySelector("#modalRoot h2");if(h)h.textContent=`👥 Présents (${se.present.length})`}
});

function isStandalone(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(S.view==="team")safeRender()});
window.addEventListener("appinstalled",()=>{installEvt=null;toast("Appli installée ✔")});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
readCode();loadLocal();render();initCloud();
})();
</script>
</body>
</html>
